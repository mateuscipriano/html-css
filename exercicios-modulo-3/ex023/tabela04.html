<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
            height: 300px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            background-color: grey;
            color: white;
             text-shadow: 1px 1px 1px black;
        }

        thead {
            font-size: 1.2em;
            background-color: gray;
            color: white;
            text-shadow: 1px 1px 1px black;
        }

        td, th {
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }

        col.grupos {
            background-color: gold;
        }

    </style>
</head>
<body>
    <h1>Tabela com Mesclagem de Células</h1>

    <table>

        <colgroup>
            <col class="grupos">
            <col class="grupo1">
            <col class="grupo21">
            <col class="grupo22">
            <col class="grupo23">
        </colgroup>
        <!-- é possível utilizar "span" para configurar mais de 1 coluna por classe-->

        <caption>Tabela Completa</caption>
        <thead>
            <th scope="col">grupos</th> <th scope="col">grupo1</th> <th colspan="3" scope="colgroup">grupo2</th>
        </thead>

        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup">grupo1.1</th>
                <td>dado1</td>
                <td>dado2</td>
                <td>dado2</td>
                <td>dado2</td>
            </tr>

            <tr>
                <td>dado1</td>
                <td>dado2</td>
                <td>dado2</td>
                <td>dado2</td>
            </tr>

            <tr>
                <td>dado1</td>
                <td>dado2</td>
                <td>dado2</td>
                <td>dado2</td>
            </tr>

            <tr>
                <th rowspan="3" scope="rowgroup">grupo1.2</th>
                <td>dado1</td>
                <td>dado2</td>
                <td>dado2</td>
                <td>dado2</td>
            </tr>

            <tr>
                <td>dado1</td>
                <td>dado2</td>
                <td>dado2</td>
                <td>dado2</td>
            </tr>

            <tr>
                <td>dado1</td>
                <td>dado2</td>
                <td>dado2</td>
                <td>dado2</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <th colspan="4" scope="row">Total</th>
                <td>1000</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
