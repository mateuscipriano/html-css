<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="#" method="get" autocomplete="on">
        <fieldset>
            <legend>dados pessoais</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="Nome" id="inome" required maxlength="30" placeholder="Nome Completo">
            </p>
            <p>
                <label for="inum">Números:</label>
                <input type="number" name="num" id="inum" size="5=" min="0" max="10"  placeholder="0 a 10" step="0.1">
            </p>
            <p>
                <label for="imes">Mês:</label>
                <input type="month" name="mes" id="imes" value="2025-12">
            </p>
            <p>
                <label for="idata">Data</label>
                <input type="date" name="data" id="idata" value="2025-12-15">
            </p>
            <p>
                <label for="ihora">Horário</label>
                <input type="time" name="hora" id="ihora" >
            </p>
            <p>
                <label for="iemail">Email</label>
                <input type="email" name="email" id="iemail" autocomplete="email">
            </p>
            <p>
                <label for="itel">telefone</label>
                <input type="tel" name="tel" id="itel" pattern="^[0-9]{4}-[0-9]{4}$">
                <!-- estuder regEx -->
            </p>
        </fieldset>

        <fieldset>
            <legend>mais elementos</legend>

            <p>
                <label for="icor">cor</label>
                <input type="color" name="cor" id="icor">
            </p>

            <p>
                <label for="inivel">Nível</label>
                <input type="range" name="nivel" id="inivel" min="1" max="5">
            </p>

            <p>
                <label for="ifile">Arquivo</label>
                <input type="file" name="file" id="ifile">
                <!-- utilizando arquivos em formulário, é obrigatório utiliar o método post -->
            </p>








        </fieldset>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>

    </form>
</body>
</html>
