<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="teste.php" method="get" autocomplete="on">
    <fieldset>
        <legend>checkbox</legend>
        <input type="checkbox" name="1" id="i1" checked> <label for="i1">1</label> <br>
        <input type="checkbox" name="2" id="i2"> <label for="i2">2</label> <br>
        <input type="checkbox" name="3" id="i3"> <label for="i3">3</label> <br>
        <input type="checkbox" name="4" id="i4"> <label for="i4">4</label> <br>
        <input type="checkbox" name="5" id="i5"> <label for="i5">5</label> <br>
    </fieldset>

    <fieldset>
        <legend>radio</legend>
        <input type="radio" name="radio" id="r1" checked> <label for="r1">1</label> <br>
        <input type="radio" name="radio" id="r2"> <label for="r2">2</label> <br>
         <!-- radio precisa ter o mesmo name e id diferente para identificar pertencimento ao mesmo grupo, assim habilitando a opção de marcar e desmarcar opções.
          "checked" serve como placeholder -->








    </fieldset>





    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>








    </form>
</body>
</html>
