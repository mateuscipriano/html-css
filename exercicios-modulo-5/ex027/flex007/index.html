<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>

        div.container {
            background-color: rgb(223, 18, 18);
            display: flex;

        }

        div.item {
            background-color: grey;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
            
        }

        div#i1 {
            order: 1;
        }

         div#i2 {
            order: 3;
        }

         div#i3 {
            order: 2;
        }

         div#i4 {
            order: 0;
        }

         div#i5 {
            order: -1;
        }

         div#i6 {
            order: -2;
        }

         div#i7 {
            order: 0;
        }

    </style>
</head>
<body>
    <div class="container">

    <div class="item" id="i1">A 1</div>
    <div class="item" id="i2">B 3</div>
    <div class="item" id="i3">C 2</div>
    <div class="item" id="i4">D 0</div>
    <div class="item" id="i5">E -1</div>
    <div class="item" id="i6">F -2</div>
    <div class="item" id="i7">G 0</div>
    </div>
</body>
</html>
