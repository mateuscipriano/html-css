<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>

        div.container {
            background-color: rgb(223, 18, 18);
            display: flex;
            height: 400px;
            align-items: flex-start;
                justify-content: ;
                align-content: ;
        }

        div.item {
            background-color: grey;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
            
        }

        div#i1 {
            align-self: flex-start;
        }

         div#i2 {
           align-self: flex-end;
        }

         div#i3 {
           align-self: center;
        }

         div#i4 {
           align-self: stretch;
        }

         div#i5 {
            align-self: auto;
           /* "auto" herda configuração do container*/
        }

         div#i6 {
           
        }

         div#i7 {
           align-self: stretch;
        }

    </style>
</head>
<body>
    <div class="container">

    <div class="item" id="i1">A </div>
    <div class="item" id="i2">B </div>
    <div class="item" id="i3">C </div>
    <div class="item" id="i4">D </div>
    <div class="item" id="i5">E </div>
    <div class="item" id="i6">F </div>
    <div class="item" id="i7">G </div>
    </div>
</body>
</html>
