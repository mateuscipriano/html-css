<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>

        div.container {
            background-color: rgb(223, 18, 18);
            display: flex;
            flex-flow: row nowrap;
            

        }

        div.item {
            background-color: grey;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
         
            
        }

    </style>
</head>
<body>
    <div class="container">

    <div class="item">A</div>
    <div class="item">conteúdo grande</div>
    <div class="item">conteúdo maior que o primeiro</div>
    <div class="item">D</div>
    <div class="item">conteúdo grande, o que irá ocupar mais espaço do container</div>
    <div class="item">F</div>
    <div class="item">G</div>
    </div>
</body>
</html>
